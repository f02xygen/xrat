[package]
name = "xrat-app"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://mhyrzt.github.io/xrat/"
description = "Application, CLI, TUI, and HTTP layers for xrat"
include = ["src/**", "templates/**", "web-assets/**", "Cargo.toml"]

[dependencies]
xrat-config.workspace = true
xrat-db.workspace = true
xrat-engines = { workspace = true, features = ["stats"] }
xrat-model.workspace = true
xrat-prober.workspace = true
xrat-support.workspace = true
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3.0"
crossterm = "0.29.0"
indicatif = "0.18.4"
flate2 = "1.1.5"
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
semver = "1.0.27"
sha2 = "0.10.9"
prost = "0.13"
tonic = { version = "0.12", default-features = false, features = [
    "transport",
    "codegen",
    "prost",
] }
percent-encoding = "2.3.2"
sqlx = { version = "0.8.6", features = [
    "sqlite",
    "postgres",
    "runtime-tokio-rustls",
] }
tokio = { version = "1.52.3", features = ["full"] }
url = "2.5.8"
serde_path_to_error = "0.1.20"
sysinfo = "0.37.2"
uuid = { version = "1.23.2", features = ["v4"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tar = "0.4.44"
toml = "1.1.2"
toml_edit = "0.25.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
maxminddb = "0.28.1"
qrcode = { version = "0.14.1", default-features = false }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
unicode-width = "0.2.2"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
if-addrs = "0.15.0"

argon2 = "0.5.3"
subtle = "2.6.1"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rust-embed = "8.7"
mime_guess = "2.0"
async-stream = "0.3.6"
futures-core = "0.3"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
xrat-web.workspace = true
qwertty = "0.1.6"
rustix = { version = "1.1.5", features = ["event", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_System_Services", "Win32_System_SystemServices", "Win32_System_EventLog", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_JobObjects", "Win32_Networking_WinInet", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
